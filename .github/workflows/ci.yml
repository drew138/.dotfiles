---
name: ci

"on":
  push:
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "LICENSE"
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: check out the codebase
        uses: actions/checkout@v6

      - name: set up python 3
        uses: actions/setup-python@v6
        with:
          # TODO: back to "3.x" once ansible-core and ansible-lint support Python 3.15
          python-version: "3.14"

      - name: install test dependencies.
        run: pip3 install yamllint ansible-lint

      - name: lint code
        run: |
          yamllint .
          ansible-lint ./*

  check-roles:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.roles.outputs.roles }}
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # pushes that only touch roles/<name>/ test those roles; everything else tests all of them
      - name: choose the roles to test
        id: roles
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all=$(find roles -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')
          roles="${all}"
          if [ "${EVENT}" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${BEFORE}" "${AFTER}" | grep -v -E '\.md$|^assets/|^LICENSE$' || true)
            if [ -n "${changed}" ] && ! grep -q -v '^roles/' <<< "${changed}"; then
              picked=$(cut -d/ -f2 <<< "${changed}" | sort -u | while read -r role; do
                [ -d "roles/${role}" ] && echo "${role}"
              done | jq -R -s -c 'split("\n")[:-1]')
              [ "${picked}" != "[]" ] && roles="${picked}"
            fi
          fi
          echo "roles=${roles}" >> "${GITHUB_OUTPUT}"
          echo "Testing roles: ${roles}" >> "${GITHUB_STEP_SUMMARY}"

  test-macos:
    needs: check-roles
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.check-roles.outputs.roles) }}
    steps:
      - name: check out the codebase
        uses: actions/checkout@v6

      - name: set up python 3
        uses: actions/setup-python@v6
        with:
          # TODO: back to "3.x" once ansible-core and ansible-lint support Python 3.15
          python-version: "3.14"

      - name: uninstall various programs
        run: |
          rm -rf /usr/local/go
          rm -rf ~/go
          rm -rf ~/.cargo
          rm -rf ~/.nvm
          rm -rf ~/go
          rm -rf ~/.go
          sudo rm -rf /opt/homebrew/bin/cpack
          sudo rm -rf /opt/homebrew/bin/ctest
          sudo rm -rf /opt/homebrew/bin/ccmake
          sudo rm -rf /opt/homebrew/bin/cmake

      - name: refresh homebrew metadata
        env:
          ROLE: ${{ matrix.role }}
        run: |
          if grep -rq "community.general.homebrew" "roles/${ROLE}"; then
            brew update
          else
            echo "roles/${ROLE} does not use homebrew, skipping the refresh"
          fi

      - name: install test dependencies
        run: pip3 install \
          ansible \
          molecule

      - name: install the github ssh key
        run: |
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "${SSH_GITHUB_KEY}" > ~/.ssh/github
          chmod 600 ~/.ssh/github
        env:
          SSH_GITHUB_KEY: ${{ secrets.SSH_GITHUB_KEY }}

      - name: run molecule tests
        run: molecule test
        env:
          ROOT_DIR: ${{ github.workspace }}
          PY_COLORS: "1"
          MOLECULE_ROLE: ${{ matrix.role }}
          GHUB_ACCESS_TOKEN: ${{ secrets.GHUB_ACCESS_TOKEN }}

  notify-errors:
    needs: test-macos
    runs-on: ubuntu-latest
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      actions: read
      contents: read
    steps:
      - name: checkout mail template
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/mail

      - name: build mail
        run: python3 .github/mail/ci_failure.py > mail.html
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}

      - name: send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: dotfiles CI failed
          to: ${{ secrets.EMAIL }}
          from: ${{ secrets.EMAIL }}
          body: "dotfiles CI failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          html_body: file://mail.html
