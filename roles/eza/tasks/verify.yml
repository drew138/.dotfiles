---
- name: Locate eza binary
  ansible.builtin.command: which eza
  register: eza_verify_which
  changed_when: false
  failed_when: false

- name: Check if eza binary exists
  ansible.builtin.stat:
    path: "{{ eza_verify_which.stdout }}"
  register: eza_verify_bin
  when: eza_verify_which.rc == 0

- name: Assert eza binary is present and executable
  ansible.builtin.assert:
    that:
      - eza_verify_bin.stat is defined
      - eza_verify_bin.stat.exists
      - eza_verify_bin.stat.executable
    fail_msg: "Eza binary was not found in the PATH or is not executable"

- name: Verify theme.yml symlink
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/eza/theme.yml"
  register: eza_theme_link

- name: Assert theme symlink is valid
  ansible.builtin.assert:
    that:
      - eza_theme_link.stat.exists
      - eza_theme_link.stat.islnk
      - eza_theme_link.stat.lnk_source ==
        ansible_facts['env']['HOME'] + '/.dotfiles/roles/eza/files/theme.yml'
    fail_msg: "Eza theme symlink is missing, broken, or pointing to the wrong source."
