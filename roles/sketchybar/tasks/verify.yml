---
- name: Verify FelixKratz tap is present
  ansible.builtin.command: brew tap
  register: sketchybar_verify_brew_taps
  changed_when: false

- name: Assert FelixKratz tap is registered
  ansible.builtin.assert:
    that:
      - "'felixkratz/formulae' in sketchybar_verify_brew_taps.stdout | lower"
    fail_msg: "The FelixKratz/formulae Homebrew tap is not available."

- name: Verify required Homebrew formulae are installed
  ansible.builtin.command: brew list --formula {{ item }}
  loop:
    - sketchybar
    - lua
  register: sketchybar_verify_formulae
  changed_when: false
  failed_when: false

- name: Assert required Homebrew formulae are installed
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "Required Homebrew formula '{{ item.item }}' is not installed"
  loop: "{{ sketchybar_verify_formulae.results }}"

- name: Stat sketchybar config directory
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/sketchybar"
    follow: false
  register: sketchybar_verify_config_dir

- name: Assert sketchybar config directory is a symlink to dotfiles
  ansible.builtin.assert:
    that:
      - sketchybar_verify_config_dir.stat.exists
      - sketchybar_verify_config_dir.stat.islnk
      - sketchybar_verify_config_dir.stat.lnk_source ==
        ansible_facts.env.HOME + '/.dotfiles/roles/sketchybar/files'
    fail_msg: >-
      SketchyBar config directory is missing, not a symlink,
      or does not point to the expected dotfiles location.

- name: Stat SbarLua module
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/share/sketchybar_lua/sketchybar.so"
  register: sketchybar_verify_lua

- name: Assert SbarLua module is installed
  ansible.builtin.assert:
    that:
      - sketchybar_verify_lua.stat.exists
      - sketchybar_verify_lua.stat.isreg
    fail_msg: >-
      SbarLua is not installed at ~/.local/share/sketchybar_lua/sketchybar.so

- name: Stat sketchybarrc inside sketchybar config
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/sketchybar/sketchybarrc"
  register: sketchybar_verify_sketchybarrc

- name: Assert sketchybarrc exists
  ansible.builtin.assert:
    that:
      - sketchybar_verify_sketchybarrc.stat.exists
      - sketchybar_verify_sketchybarrc.stat.isreg
    fail_msg: "sketchybarrc does not exist inside the sketchybar config directory"

- name: Stat clipwatch binary and widget helpers
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin/clipwatch"
    - "{{ ansible_facts['env']['HOME'] }}/.dotfiles/roles/sketchybar/files/helpers/herdr_poll.lua"
    - "{{ ansible_facts['env']['HOME'] }}/.dotfiles/roles/sketchybar/files/helpers/brew_outdated.sh"
    - "{{ ansible_facts['env']['HOME'] }}/.dotfiles/roles/sketchybar/files/helpers/brew_upgrade.sh"
    - "{{ ansible_facts['env']['HOME'] }}/.dotfiles/roles/sketchybar/files/helpers/clipboard_copy.lua"
  register: sketchybar_verify_helpers

- name: Assert clipwatch and the widget helpers are executable
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.executable
    fail_msg: "{{ item.item }} is missing or not executable"
  loop: "{{ sketchybar_verify_helpers.results }}"

- name: Stat widget item modules
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/sketchybar/items/{{ item }}/init.lua"
  loop:
    - brew
    - clipboard
    - herdr
    - spaces
    - uptime
  register: sketchybar_verify_items

- name: Assert widget item modules are present
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "sketchybar item module '{{ item.item }}' is missing"
  loop: "{{ sketchybar_verify_items.results }}"
