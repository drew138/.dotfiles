---
- name: Install the agent harnesses
  community.general.homebrew:
    name: "{{ ai_harnesses }}"
    state: latest

- name: Check whether claude code is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  register: ai_claude_binary

- name: Download the claude code installer
  ansible.builtin.get_url:
    url: "{{ ai_claude_installer_url }}"
    dest: "{{ ai_claude_installer_path }}"
    mode: "0755"
  when: not ai_claude_binary.stat.exists

- name: Install claude code
  ansible.builtin.command: "{{ ai_claude_installer_path }}"
  when: not ai_claude_binary.stat.exists
  changed_when: true

- name: Remove the claude code installer
  ansible.builtin.file:
    path: "{{ ai_claude_installer_path }}"
    state: absent
  when: not ai_claude_binary.stat.exists

- name: Ensure the skill directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0755"
  loop: "{{ [ai_skills_source] + ai_skill_targets }}"

- name: Find the skills in the repository
  ansible.builtin.find:
    paths: "{{ ai_skills_source }}"
    file_type: directory
    recurse: false
  register: ai_skills

- name: Create symbolic links for each skill in each harness
  ansible.builtin.file:
    src: "{{ item.0.path }}"
    dest: "{{ item.1 }}/{{ item.0.path | basename }}"
    owner: "{{ ansible_facts['env']['USER'] }}"
    state: link
    force: true
    follow: false
  loop: "{{ ai_skills.files | product(ai_skill_targets) | list }}"
  loop_control:
    label: "{{ item.0.path | basename }} -> {{ item.1 }}"
