---
- name: Install the agent harnesses
  community.general.homebrew:
    name: "{{ ai_harnesses }}"
    state: latest

- name: Check whether claude code is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  register: ai_claude_binary

- name: Download the claude code installer
  ansible.builtin.get_url:
    url: "{{ ai_claude_installer_url }}"
    dest: "{{ ai_claude_installer_path }}"
    mode: "0755"
  when: not ai_claude_binary.stat.exists

- name: Install claude code
  ansible.builtin.command: "{{ ai_claude_installer_path }}"
  when: not ai_claude_binary.stat.exists
  changed_when: true

- name: Remove the claude code installer
  ansible.builtin.file:
    path: "{{ ai_claude_installer_path }}"
    state: absent
  when: not ai_claude_binary.stat.exists

- name: Check whether the antigravity cli is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/agy"
  register: ai_antigravity_binary

- name: Download the antigravity cli installer
  ansible.builtin.get_url:
    url: "{{ ai_antigravity_installer_url }}"
    dest: "{{ ai_antigravity_installer_path }}"
    mode: "0755"
  when: not ai_antigravity_binary.stat.exists

- name: Install the antigravity cli
  ansible.builtin.command: "{{ ai_antigravity_installer_path }}"
  when: not ai_antigravity_binary.stat.exists
  changed_when: true

- name: Remove the antigravity cli installer
  ansible.builtin.file:
    path: "{{ ai_antigravity_installer_path }}"
    state: absent
  when: not ai_antigravity_binary.stat.exists

- name: Ensure the rules directories exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0755"
  loop: "{{ ai_rules_targets }}"

- name: Create symbolic links for the agent rules in each harness
  ansible.builtin.file:
    src: "{{ ai_rules_source }}"
    dest: "{{ item }}"
    owner: "{{ ansible_facts['env']['USER'] }}"
    state: link
    force: true
    follow: false
  loop: "{{ ai_rules_targets }}"
  loop_control:
    label: "{{ item }}"
