---
- name: Check the claude code binary
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  register: ai_verify_claude

- name: Assert claude code is installed
  ansible.builtin.assert:
    that:
      - ai_verify_claude.stat.exists
      - ai_verify_claude.stat.executable
    fail_msg: "claude code was not found at ~/.local/bin/claude"

- name: Check the antigravity cli binary
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/agy"
  register: ai_verify_antigravity

- name: Assert the antigravity cli is installed
  ansible.builtin.assert:
    that:
      - ai_verify_antigravity.stat.exists
      - ai_verify_antigravity.stat.executable
    fail_msg: "the antigravity cli was not found at ~/.local/bin/agy"

- name: List installed homebrew packages
  ansible.builtin.command: brew list --formula
  register: ai_verify_brew_list
  changed_when: false
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Assert the harnesses are installed
  ansible.builtin.assert:
    that:
      - item in ai_verify_brew_list.stdout_lines
    fail_msg: "harness {{ item }} is not installed"
  loop: "{{ ai_harnesses }}"

- name: Check the rules symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ ai_rules_targets }}"
  register: ai_verify_rules

- name: Assert the rules are linked into every harness
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.islnk
      - item.stat.lnk_source == ai_rules_source
    fail_msg: "{{ item.item }} is missing, is not a link, or points elsewhere"
  loop: "{{ ai_verify_rules.results }}"
  loop_control:
    label: "{{ item.item }}"
