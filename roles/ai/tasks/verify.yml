---
- name: Find the skills in the repository
  ansible.builtin.find:
    paths: "{{ ai_skills_source }}"
    file_type: directory
    recurse: false
  register: ai_verify_skills

- name: Check the skill symlinks
  ansible.builtin.stat:
    path: "{{ item.1 }}/{{ item.0.path | basename }}"
  loop: "{{ ai_verify_skills.files | product(ai_skill_targets) | list }}"
  loop_control:
    label: "{{ item.0.path | basename }} -> {{ item.1 }}"
  register: ai_verify_links

- name: Assert every skill is linked into every harness
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.islnk
      - item.stat.lnk_source == item.item[0].path
    fail_msg: "{{ item.item[1] }}/{{ item.item[0].path | basename }} is missing or points elsewhere"
  loop: "{{ ai_verify_links.results }}"
  loop_control:
    label: "{{ item.item[0].path | basename }} -> {{ item.item[1] }}"
