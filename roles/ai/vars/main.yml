---
ai_claude_installer_url: https://claude.ai/install.sh
ai_claude_installer_path: /tmp/claude-code-install.sh

ai_harnesses:
  - gemini-cli
  - opencode

ai_rules_source: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/roles/ai/files/rules/AGENTS.md"
ai_rules_targets:
  - "{{ ansible_facts['env']['HOME'] }}/.claude/CLAUDE.md"
  - "{{ ansible_facts['env']['HOME'] }}/.gemini/GEMINI.md"
  - "{{ ansible_facts['env']['HOME'] }}/.config/opencode/AGENTS.md"
