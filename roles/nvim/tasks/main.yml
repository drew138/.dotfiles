---
- name: Installs cmake
  community.general.homebrew_cask:
    name:
      - cmake
    state: present

- name: Install dependencies
  community.general.homebrew:
    name:
      - make
      - python
      - tree-sitter-cli
    state: latest

- name: Install the python Mason builds its tools with
  community.general.homebrew:
    name: "python@{{ nvim_mason_python }}"
    state: present

- name: Create the Mason python shim directory
  ansible.builtin.file:
    path: "{{ nvim_mason_python_shim }}"
    state: directory
    mode: "0755"

- name: Point the Mason python shim at the pinned python
  ansible.builtin.file:
    src: "/opt/homebrew/opt/python@{{ nvim_mason_python }}/bin/python{{ nvim_mason_python }}"
    dest: "{{ nvim_mason_python_shim }}/python3"
    state: link

- name: Check if nvim is installed
  ansible.builtin.stat:
    path: /usr/local/bin/nvim
  register: nvim_is_installed
  changed_when: not nvim_is_installed.stat.exists
  notify:
    - install_neovim_development_tools

- name: Clone nvim repository
  ansible.builtin.git:
    repo: "https://github.com/neovim/neovim.git"
    dest: "{{ ansible_facts['env']['HOME'] }}/dev/neovim"
    version: "{{ nvim_release_branch }}"
    depth: 1
    clone: true
    update: true
    force: true

- name: Build and install nvim
  become: true
  ansible.builtin.shell:
    cmd: |
      sudo make distclean
      sudo make CMAKE_BUILD_TYPE=RelWithDebInfo
      sudo make install
    chdir: "{{ ansible_facts['env']['HOME'] }}/dev/neovim"
  changed_when: false
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Create the neovim python virtual environment from the pinned python
  ansible.builtin.command: >-
    /opt/homebrew/bin/uv venv --python "{{ nvim_mason_python_shim }}/python3"
    "{{ ansible_facts['env']['HOME'] }}/.nvimvenv"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.nvimvenv/bin/activate"

- name: Install pynvim in the neovim virtual environment
  ansible.builtin.command: >-
    /opt/homebrew/bin/uv pip install --upgrade pynvim
    --python "{{ ansible_facts['env']['HOME'] }}/.nvimvenv/bin/python"
  register: nvim_pynvim_install
  changed_when: "'Installed' in nvim_pynvim_install.stderr"

- name: Install the neovim npm package with the default node
  ansible.builtin.command: "{{ nvim_node_bin }}/npm install -g neovim"
  environment:
    PATH: "{{ nvim_node_bin }}:/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: false

- name: Install luajit
  community.general.homebrew:
    name:
      - luajit
    state: latest

- name: Ensure tool config directories exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item.parent_directory }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_facts.env.USER }}"
  loop: "{{ nvim_tool_configs }}"

- name: Create symbolic links for tool configs
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    owner: "{{ ansible_facts.env.USER }}"
    state: link
    force: true
    follow: false
  loop: "{{ nvim_tool_configs }}"
