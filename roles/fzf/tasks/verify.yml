---
- name: Check if fzf is installed
  ansible.builtin.command: brew list --versions fzf
  register: fzf_verify_brew_list
  changed_when: false
  failed_when: false

- name: Assert fzf is reported as installed by Homebrew
  ansible.builtin.assert:
    that:
      - fzf_verify_brew_list.rc == 0
    fail_msg: "fzf is not reported as installed by Homebrew"

- name: Locate the fzf binary
  ansible.builtin.command: which fzf
  register: fzf_verify_which
  changed_when: false
  failed_when: false

- name: Assert fzf is the Homebrew copy
  ansible.builtin.assert:
    that:
      - fzf_verify_which.rc == 0
      - "'/opt/homebrew/bin/fzf' in fzf_verify_which.stdout"
    fail_msg: "fzf was not found in the PATH or is not the Homebrew copy"
