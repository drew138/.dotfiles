---
- name: Ensure FelixKratz Homebrew tap is available
  community.general.homebrew_tap:
    name: FelixKratz/formulae
    state: present

- name: Read trusted homebrew entries
  ansible.builtin.command: brew trust --json v1
  register: jankyborders_trusted
  changed_when: false
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Trust the borders formula
  ansible.builtin.command: brew trust --formula felixkratz/formulae/borders
  when: "'felixkratz/formulae/borders' not in jankyborders_trusted.stdout"
  changed_when: true
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install jankyborders
  community.general.homebrew:
    name:
      - felixkratz/formulae/borders
    state: latest

- name: Ensure jankyborders config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .config
    - .config/borders

- name: Create jankyborders symlink
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/roles/jankyborders/files/bordersrc"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/borders/bordersrc"
    owner: "{{ ansible_facts['env']['USER'] }}"
    state: link
    force: true
    follow: false
