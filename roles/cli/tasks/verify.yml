---
- name: List installed homebrew packages
  ansible.builtin.command: brew list --formula
  register: cli_verify_brew_list
  changed_when: false

- name: Assert all configured brew packages are installed
  ansible.builtin.assert:
    that:
      - item in cli_verify_brew_list.stdout_lines
    fail_msg: "homebrew package '{{ item }}' is not installed"
  loop: "{{ cli_brew_packages }}"

- name: List python tools installed with uv
  ansible.builtin.command: /opt/homebrew/bin/uv tool list
  register: cli_verify_uv_tools
  changed_when: false

- name: Assert python tools are installed with uv
  ansible.builtin.assert:
    that:
      - cli_verify_uv_tools.stdout is search('(?m)^' ~ item ~ ' v')
    fail_msg: "python tool '{{ item }}' is not installed with uv"
  loop: "{{ cli_uv_tools }}"
