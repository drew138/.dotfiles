---
- name: Install various clis
  community.general.homebrew:
    name: "{{ cli_brew_packages }}"
    state: latest

- name: Install python tools with uv
  ansible.builtin.command: "/opt/homebrew/bin/uv tool install {{ item }}"
  loop: "{{ cli_uv_tools }}"
  register: cli_uv_tool_install
  changed_when: "'Installed' in cli_uv_tool_install.stderr"

- name: Upgrade python tools installed with uv
  ansible.builtin.command: /opt/homebrew/bin/uv tool upgrade --all
  register: cli_uv_tool_upgrade
  changed_when: "'Updated' in cli_uv_tool_upgrade.stderr"
