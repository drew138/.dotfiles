---
- name: Check whether Dials is installed
  ansible.builtin.stat:
    path: "{{ dials_app }}"
  register: dials_app_stat
- name: Install Dials from the latest release
  when: not dials_app_stat.stat.exists
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
    GH_TOKEN: "{{ lookup('ansible.builtin.env', 'GH_TOKEN') or lookup('ansible.builtin.env', 'GHUB_ACCESS_TOKEN') }}"
  block:
    - name: Check gh can reach the release
      ansible.builtin.command: gh release view --repo {{ dials_repo }} --json tagName
      register: dials_release
      changed_when: false
      failed_when: false

    - name: Assert gh can reach the release
      ansible.builtin.assert:
        that:
          - dials_release.rc == 0
        fail_msg: >-
          gh cannot read the latest release of {{ dials_repo }}, a private repository.
          Run 'gh auth login' and try again.
          Output: {{ dials_release.stderr }}

    - name: Create a download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: dials
      register: dials_tmp

    - name: Download the release
      ansible.builtin.command: >
        gh release download --repo {{ dials_repo }}
        --pattern {{ dials_asset }} --dir {{ dials_tmp.path }}
      changed_when: true

    - name: Unpack Dials into Applications
      ansible.builtin.command: >
        ditto -x -k {{ dials_tmp.path }}/{{ dials_asset }} {{ dials_app | dirname }}
      args:
        creates: "{{ dials_app }}"

    - name: Open Dials
      ansible.builtin.command: open {{ dials_app }}
      changed_when: true
  always:
    - name: Remove the download directory
      ansible.builtin.file:
        path: "{{ dials_tmp.path }}"
        state: absent
      when: dials_tmp.path is defined

- name: Ensure LaunchAgents exists
  ansible.builtin.file:
    path: "{{ dials_launch_agent | dirname }}"
    state: directory
    mode: "0755"

- name: Open Dials at login
  ansible.builtin.copy:
    src: com.andressalazar.dials.plist
    dest: "{{ dials_launch_agent }}"
    mode: "0644"
