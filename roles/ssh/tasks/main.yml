---
- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0700"

- name: Read the keys in the Bitwarden ssh agent
  ansible.builtin.command: ssh-add -L
  environment:
    SSH_AUTH_SOCK: "{{ ssh_agent_socket }}"
  register: ssh_agent_keys
  changed_when: false
  failed_when: false
  when: not (ssh_in_ci | bool)

- name: Wait for Bitwarden to be unlocked
  when: not (ssh_in_ci | bool) and ssh_github_key_name not in ssh_agent_keys.stdout
  block:
    - name: Open Bitwarden
      ansible.builtin.command: open -a Bitwarden
      changed_when: false

    - name: Say what to do in Bitwarden
      ansible.builtin.debug:
        msg:
          - "Bitwarden holds the ssh keys the next roles need. Waiting until it is unlocked:"
          - "1. Log in to Bitwarden and unlock it."
          - "2. The first time only: Settings -> Enable SSH agent."

    - name: Wait until the Bitwarden ssh agent holds the github key
      ansible.builtin.command: ssh-add -L
      environment:
        SSH_AUTH_SOCK: "{{ ssh_agent_socket }}"
      register: ssh_agent_keys_unlocked
      changed_when: false
      failed_when: ssh_github_key_name not in ssh_agent_keys_unlocked.stdout
      retries: 180
      delay: 5
      until: ssh_github_key_name in ssh_agent_keys_unlocked.stdout

- name: Derive the github public key from the key ci provides
  ansible.builtin.command: "ssh-keygen -y -f {{ ansible_facts['env']['HOME'] }}/.ssh/github"
  register: ssh_ci_public_key
  changed_when: false
  when: ssh_in_ci | bool

- name: Pick the github public key
  ansible.builtin.set_fact:
    ssh_github_public_key: >-
      {{
        ssh_ci_public_key.stdout if (ssh_in_ci | bool) else
        ((ssh_agent_keys_unlocked.stdout_lines if ssh_agent_keys_unlocked.stdout_lines is defined else ssh_agent_keys.stdout_lines)
         | select('search', ssh_github_key_name ~ '$') | first)
      }}

- name: Save the github public key
  ansible.builtin.copy:
    content: "{{ ssh_github_public_key }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/github.pub"
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0644"

- name: Route ssh through the Bitwarden agent
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0600"
    content: |
      Include {{ ansible_facts['env']['HOME'] }}/.colima/ssh_config
      Include {{ ansible_facts['env']['HOME'] }}/.ssh/config.d/*

      Host github.com
          IdentityFile ~/.ssh/github

      Host *
          IdentityAgent {{ ssh_agent_socket }}
          IdentitiesOnly yes

- name: Point every zsh at the Bitwarden agent
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshenv"
    line: 'export SSH_AUTH_SOCK="{{ ssh_agent_socket }}"'
    create: true
    mode: "0600"

- name: Read github's host keys from its API over https
  ansible.builtin.uri:
    url: https://api.github.com/meta
    return_content: true
    url_username: "{{ 'token' if ssh_github_token else omit }}"
    url_password: "{{ ssh_github_token if ssh_github_token else omit }}"
    force_basic_auth: "{{ ssh_github_token | length > 0 }}"
  register: ssh_github_meta
  retries: 3
  delay: 5
  until: ssh_github_meta.status == 200 and ssh_github_meta.json.ssh_keys | default([]) | length > 0

- name: Trust github's host keys
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts"
    line: "github.com {{ ssh_github_host_key }}"
    create: true
    mode: "0644"
  loop: "{{ ssh_github_meta.json.ssh_keys }}"
  loop_control:
    loop_var: ssh_github_host_key
    label: "{{ ssh_github_host_key.split()[0] }}"
