---
- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0700"

- name: Save the public keys
  ansible.builtin.copy:
    content: "{{ ssh_public_key.value }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/{{ ssh_public_key.key }}.pub"
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0644"
  loop: "{{ ssh_public_keys | dict2items }}"
  loop_control:
    loop_var: ssh_public_key
    label: "{{ ssh_public_key.key }}"

- name: Route ssh through the Bitwarden agent
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    create: true
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0600"
    block: |
      Host github.com
          IdentityFile ~/.ssh/github

      Host amaterasu
          HostName 192.168.78.167
          HostKeyAlias amaterasu
          User drew
          IdentityFile ~/.ssh/amaterasu

      Host *
          IdentityAgent {{ ssh_agent_socket }}
          IdentitiesOnly yes

- name: Capture the github host keys
  ansible.builtin.command: ssh-keyscan github.com
  register: ssh_github_host_keys
  changed_when: false
  retries: 3
  delay: 5
  until: ssh_github_host_keys.rc == 0 and ssh_github_host_keys.stdout | length > 0

- name: Add the github host keys to known_hosts
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts"
    line: "{{ ssh_host_key_line }}"
    create: true
    mode: "0644"
  loop: "{{ ssh_github_host_keys.stdout_lines | reject('match', '^#') | list }}"
  loop_control:
    loop_var: ssh_host_key_line
  no_log: true
  changed_when: false
