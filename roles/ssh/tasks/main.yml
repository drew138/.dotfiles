---
- name: Install Bitwarden, which holds the ssh keys
  community.general.homebrew_cask:
    name: bitwarden
    state: present
  when: not (ssh_in_ci | bool)

- name: Check that the Bitwarden ssh agent holds the github key
  ansible.builtin.command: ssh-add -L
  environment:
    SSH_AUTH_SOCK: "{{ ssh_agent_socket }}"
  register: ssh_agent_keys
  changed_when: false
  failed_when: false
  when: not (ssh_in_ci | bool)

- name: Ask for Bitwarden to be unlocked
  when: not (ssh_in_ci | bool) and ssh_public_keys.github not in ssh_agent_keys.stdout
  block:
    - name: Open Bitwarden
      ansible.builtin.command: open -a Bitwarden
      changed_when: false

    - name: Wait until Bitwarden is unlocked
      ansible.builtin.pause:
        prompt: |-
          Bitwarden holds the ssh keys the next roles need.
            1. Log in to Bitwarden and unlock it.
            2. The first time only: Settings -> Enable SSH agent.
          Press Enter when it is unlocked

    - name: Check the Bitwarden ssh agent again
      ansible.builtin.command: ssh-add -L
      environment:
        SSH_AUTH_SOCK: "{{ ssh_agent_socket }}"
      register: ssh_agent_keys_again
      changed_when: false
      failed_when: false

    - name: Assert the Bitwarden ssh agent holds the github key
      ansible.builtin.assert:
        that:
          - ssh_public_keys.github in ssh_agent_keys_again.stdout
        fail_msg: >
          The Bitwarden ssh agent at {{ ssh_agent_socket }} does not hold the "Github auth keys" key.
          Unlock Bitwarden, turn on Settings -> Enable SSH agent, and run the playbook again.

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0700"

- name: Save the public keys
  ansible.builtin.copy:
    content: "{{ ssh_public_key.value }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/{{ ssh_public_key.key }}.pub"
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0644"
  loop: "{{ ssh_public_keys | dict2items }}"
  loop_control:
    loop_var: ssh_public_key
    label: "{{ ssh_public_key.key }}"

- name: Route ssh through the Bitwarden agent
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0600"
    content: |
      Include {{ ansible_facts['env']['HOME'] }}/.colima/ssh_config
      Include {{ ansible_facts['env']['HOME'] }}/.ssh/config.d/*

      Host github.com
          IdentityFile ~/.ssh/github

      Host *
          IdentityAgent {{ ssh_agent_socket }}
          IdentitiesOnly yes

- name: Point every zsh at the Bitwarden agent
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshenv"
    line: 'export SSH_AUTH_SOCK="{{ ssh_agent_socket }}"'
    create: true
    mode: "0600"

- name: Capture the github host keys
  ansible.builtin.command: ssh-keyscan github.com
  register: ssh_github_host_keys
  changed_when: false
  retries: 3
  delay: 5
  until: ssh_github_host_keys.rc == 0 and ssh_github_host_keys.stdout | length > 0

- name: Add the github host keys to known_hosts
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts"
    line: "{{ ssh_host_key_line }}"
    create: true
    mode: "0644"
  loop: "{{ ssh_github_host_keys.stdout_lines | reject('match', '^#') | list }}"
  loop_control:
    loop_var: ssh_host_key_line
  no_log: true
  changed_when: false
