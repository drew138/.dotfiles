---
- name: Read login settings
  ansible.builtin.command: "{{ item.cmd }}"
  register: auth_verify_settings
  changed_when: false
  failed_when: false
  loop:
    - name: TALLogoutSavesState
      cmd: defaults read com.apple.loginwindow TALLogoutSavesState
      expected: "0"

- name: Assert login settings
  ansible.builtin.assert:
    that:
      - item.stdout | trim == item.item.expected
    fail_msg: >-
      Login setting {{ item.item.name }} is incorrect
      (expected={{ item.item.expected }}, got={{ item.stdout | trim | default('unset') }})
    success_msg: "Login setting {{ item.item.name }} is correct"
  loop: "{{ auth_verify_settings.results }}"

- name: Read the sudo Touch ID config
  ansible.builtin.slurp:
    src: /etc/pam.d/sudo_local
  register: auth_verify_sudo_local

- name: Assert sudo can use Touch ID
  ansible.builtin.assert:
    that:
      - "'pam_tid.so' in (auth_verify_sudo_local.content | b64decode)"
      - "auth_pam_reattach in (auth_verify_sudo_local.content | b64decode)"
    fail_msg: /etc/pam.d/sudo_local does not enable Touch ID for sudo

- name: Check sudo still loads its PAM config
  ansible.builtin.command: sudo -n true
  register: auth_verify_sudo
  changed_when: false
  failed_when: >-
    auth_verify_sudo.rc != 0
    and 'a password is required' not in auth_verify_sudo.stderr
