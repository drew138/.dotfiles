---
- name: Check menu bar auto-hide status
  ansible.builtin.command: >
    osascript -e 'tell application "System Events" to get autohide menu bar of dock preferences'
  register: menubar_verify_status
  changed_when: false

- name: Assert menu bar auto-hide is disabled
  ansible.builtin.assert:
    that:
      - menubar_verify_status.stdout == "false"
    success_msg: "Menu bar auto-hide is disabled"
    fail_msg: "Menu bar auto-hide is NOT disabled"
