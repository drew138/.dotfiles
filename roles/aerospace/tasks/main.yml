---
- name: Read trusted homebrew entries
  ansible.builtin.command: brew trust --json v1
  register: aerospace_trusted
  changed_when: false
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Trust the aerospace cask
  ansible.builtin.command: brew trust --cask nikitabobko/tap/aerospace
  when: "'nikitabobko/tap/aerospace' not in aerospace_trusted.stdout"
  changed_when: true
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install aerospace
  community.general.homebrew_cask:
    name: nikitabobko/tap/aerospace
    state: present

- name: Create ~/.config/aerospace directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/aerospace"
    state: directory
    mode: "0700"
    owner: "{{ ansible_facts['env']['USER'] }}"

- name: Create aerospace symlink
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/roles/aerospace/files/aerospace.toml"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/aerospace/aerospace.toml"
    owner: "{{ ansible_facts['env']['USER'] }}"
    state: link
    force: true
    follow: false
